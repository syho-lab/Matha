services:
  - type: web
    name: mega-math-bot
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      sudo apt-get update
      sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-rus
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        value: your_bot_token_here
